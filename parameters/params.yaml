/**:
  ros__parameters:
    use_sim_time: true

    global_costmap:
      global_costmap:
        ros__parameters:
          global_frame: map
          robot_base_frame: base_footprint
          update_frequency: 2.0
          publish_frequency: 1.0
          resolution: 0.05
          rolling_window: true
          width: 20.0
          height: 20.0
          robot_radius: 0.105
          track_unknown_space: true
          plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
          static_layer:
            plugin: "nav2_costmap_2d::StaticLayer"
            map_subscribe_transient_local: true
          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            observation_sources: scan
            scan:
              topic: /scan
              data_type: LaserScan
              clearing: true
              marking: true
              obstacle_max_range: 3.0
              raytrace_max_range: 3.5
          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            inflation_radius: 0.20

    local_costmap:
      local_costmap:
        ros__parameters:
          global_frame: odom
          robot_base_frame: base_footprint
          update_frequency: 5.0
          publish_frequency: 2.0
          rolling_window: true
          width: 6.0
          height: 6.0
          resolution: 0.05
          robot_radius: 0.105
          plugins: ["obstacle_layer", "inflation_layer"]
          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            observation_sources: scan
            scan:
              topic: /scan
              data_type: LaserScan
              clearing: true
              marking: true
              obstacle_max_range: 3.0
              raytrace_max_range: 3.5
          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            inflation_radius: 0.20
